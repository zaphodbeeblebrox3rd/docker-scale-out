# Open OnDemand portal configuration
# https://osc.github.io/ood-documentation/latest/reference/files/ood-portal-yml.html

# Plain HTTP on port 80 inside the container (published as 8081)
servername: null
port: 80
ssl: null

# Basic auth against the htpasswd file populated by entrypoint.sh;
# authenticated user maps 1:1 to the system user (default user_map_match '.*')
auth:
  - 'AuthType Basic'
  - 'AuthName "private"'
  - 'AuthUserFile "/etc/httpd/.htpasswd"'
  - 'RequestHeader unset Authorization'
  - 'Require valid-user'

oidc_uri: null
